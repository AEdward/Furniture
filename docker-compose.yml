services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: goldenwood
      MYSQL_USER: furniture_app
      MYSQL_PASSWORD: furniture_dev_pw
      MYSQL_ROOT_PASSWORD: furniture_root_pw
    ports:
      - "3306:3306"
    volumes:
      - furniture-db-data:/var/lib/mysql

volumes:
  furniture-db-data:
